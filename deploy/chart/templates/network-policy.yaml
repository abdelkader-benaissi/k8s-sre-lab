apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-flows}
spec:
  podSelector: {matchLabels: {app: sre-api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {access: sre-api}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports: [{port: 8080}]
  egress:
    - {to: [{podSelector: {matchLabels: {app: postgres}}}], ports: [{port: 5432}]}
    - {to: [{podSelector: {matchLabels: {app: redis}}}], ports: [{port: 6379}]}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dependencies-from-api}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [postgres, redis]}]}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: sre-api}}}]}]
